name: Code Connect Figma Sync

on:
  pull_request:
    paths:
      - '.github/workflows/code-connect-sync.yml'
      - 'figma/code-connect/**'
      - 'tools/code-connect/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/components/Avatar/**'
      - 'src/components/Card/**'
      - 'src/components/Checkbox/**'
      - 'src/components/Hotkey/**'
      - 'src/components/Label/**'
      - 'src/components/User/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Check Figma Drift
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Packages
        run: npm ci

      - name: Run Code Connect sync
        id: sync
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          report="$RUNNER_TEMP/code-connect-sync-report.json"
          set +e
          npm run code-connect:sync -- --format=json --output "$report" --no-fail-on-drift
          exit_code=$?
          set -e

          if [ ! -s "$report" ]; then
            printf '{"status":"error","componentsChecked":0,"messages":["code-connect:sync did not produce a JSON report"]}\n' > "$report"
          fi

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.sync.outputs.report }}
        with:
          script: |
            const fs = require('node:fs');
            const {pathToFileURL} = require('node:url');

            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            const {
              CODE_CONNECT_SYNC_COMMENT_MARKER,
              renderFigmaSyncComment,
            } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/tools/code-connect/lib.mjs`).href);

            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.body?.includes(CODE_CONNECT_SYNC_COMMENT_MARKER),
            );

            if (report.status === 'ok') {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                });
              }

              core.info('No Code Connect drift detected.');
              return;
            }

            const body = renderFigmaSyncComment(report);

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail on sync infrastructure errors
        if: steps.sync.outputs.exit_code != '0'
        run: exit 1
