name: Code Connect Figma Sync

on:
  pull_request:
    paths:
      - '.github/workflows/code-connect-sync.yml'
      - 'figma/code-connect/**'
      - 'tools/code-connect/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Check Figma Drift
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Packages
        run: npm ci

      - name: Run Code Connect sync
        id: sync
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          report="$RUNNER_TEMP/code-connect-sync-report.json"
          comment="$RUNNER_TEMP/code-connect-sync-comment.md"
          set +e
          npm run code-connect:sync -- --format=json --output "$report" --no-fail-on-drift
          exit_code=$?
          set -e

          if [ ! -s "$report" ]; then
            printf '{"status":"error","componentsChecked":0,"messages":["code-connect:sync did not produce a JSON report"]}\n' > "$report"
            exit_code=1
          fi

          status="$(node tools/code-connect/render-sync-comment.mjs "$report" "$comment")"

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "comment=$comment" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Update PR comment
        if: github.event_name == 'pull_request' && steps.sync.outputs.status != 'ok'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: code-connect-sync
          path: ${{ steps.sync.outputs.comment }}

      - name: Delete PR comment
        if: github.event_name == 'pull_request' && steps.sync.outputs.status == 'ok'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: code-connect-sync
          delete: true

      - name: Fail on sync infrastructure errors
        if: steps.sync.outputs.exit_code != '0'
        run: exit 1
